name: README health check

# Guards the profile page against silent breakage: the README depends on
# third-party image renderers (stats cards, streak card, badges) that pause,
# get rate-limited or vanish without warning.
#
# This workflow re-checks every asset and link in README.md and fails if one is
# broken, so the owner is notified before visitors see a broken profile.
# It never writes to the repository.

on:
  workflow_dispatch:
  schedule:
    - cron: "23 6 * * 1" # Mondays, 06:23 UTC
  push:
    paths:
      - "README.md"
      - "scripts/check_readme_assets.py"
      - ".github/workflows/readme-health.yml"

permissions:
  contents: read

jobs:
  verify:
    name: Verify README assets and links
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check every image endpoint
        run: python3 scripts/check_readme_assets.py --images

      - name: Check every link
        run: python3 scripts/check_readme_assets.py

      - name: Publish report
        if: always()
        run: |
          {
            echo "### README asset health"
            echo ""
            if [ -f /tmp/readme-health.md ]; then
              cat /tmp/readme-health.md
            else
              echo "No report was produced — the checker crashed."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
