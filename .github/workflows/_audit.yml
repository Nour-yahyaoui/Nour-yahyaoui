name: TEMP verify

on:
  push:
    branches: ["**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Run checker on final README
        run: |
          mkdir -p audit
          set +e
          python3 scripts/check_readme_assets.py > audit/verify.txt 2>&1
          echo "EXIT=$?" >> audit/verify.txt
          set -e
          cp /tmp/readme-health.md audit/verify.md 2>/dev/null || true
          cat audit/verify.txt
      - name: Publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit
          git commit -m "chore(audit): verification report [skip ci]" || exit 0
          git push
